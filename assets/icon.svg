<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="1024" height="1024" role="img" aria-label="Logo">
  <!-- The app icon: the favicon's mark on a full-bleed square, for listings
       and app pages that round or circle-crop it themselves. The mark sits in
       the middle 54%, inside any circle crop. -->
  <rect width="32" height="32" fill="#3fb3a6"/>
  <g fill="none" stroke="#13110e" stroke-width="2.3" stroke-linecap="round">
    <path d="M10 10 C 16.5 10, 15.5 16, 21 16"/>
    <path d="M10 22 C 16.5 22, 15.5 16, 21 16"/>
  </g>
  <g fill="#13110e">
    <circle cx="10" cy="10" r="2.7"/>
    <circle cx="10" cy="22" r="2.7"/>
    <circle cx="22" cy="16" r="2.7"/>
  </g>
</svg>
